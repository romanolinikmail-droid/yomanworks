<script>
const GITHUB_OWNER = "romanolinikmail-droid";
const GITHUB_REPO = "yomanworks";

async function syncLatestWheelToolRelease() {
  const button = document.getElementById("apk-download");

  try {
    const response = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases?per_page=10`,
      {
        headers: { "Accept": "application/vnd.github+json" },
        cache: "no-store"
      }
    );

    if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);

    const releases = await response.json();
    const release = releases.find(r => !r.draft && !r.prerelease);

    if (!release) throw new Error("No published release found");

    const apk = (release.assets || []).find(asset =>
      asset.name.toLowerCase().endsWith(".apk")
    );

    if (!apk) throw new Error("Latest release has no APK asset");

    const releaseName = (release.name || release.tag_name || "").trim();

    button.textContent = `Download APK ${releaseName}`;
    button.href = apk.browser_download_url;
    button.style.display = "inline-block";
  } catch (error) {
    console.error("WheelTool release sync failed:", error);
    button.textContent = "Download APK";
    button.href = `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/releases`;
    button.style.display = "inline-block";
  }
}

syncLatestWheelToolRelease();
</script>

<script>
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
const lynx = document.getElementById("lynx");
let mouseX = 0, mouseY = 0, lynxX = 0, lynxY = 0, prevMouseX = 0, tilt = 0;

document.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  const deltaX = mouseX - prevMouseX;
  prevMouseX = mouseX;
  tilt += deltaX * 0.2;
  tilt *= 0.85;
  tilt = Math.max(-45, Math.min(45, tilt));
});

function animate() {
  lynxX += (mouseX - lynxX) * 0.1;
  lynxY += (mouseY - lynxY) * 0.1;
  tilt *= 0.9;
  if (Math.abs(tilt) < 0.05) tilt = 0;
  lynx.style.transform =
    `translate(${lynxX - -40}px, ${lynxY - -20}px) rotate(${tilt}deg)`;
  requestAnimationFrame(animate);
}
animate();
</script>
