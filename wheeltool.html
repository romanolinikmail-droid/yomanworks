<script>
const SHOPIFY_STORE_DOMAIN = "yomanworks.myshopify.com";
const SHOPIFY_STOREFRONT_TOKEN = "bb212b00259ab8c596a5af524d64f56f";
const SHOPIFY_API_VERSION = "2026-07";
const SHOPIFY_PRODUCT_HANDLE = "wheeltool";

let wheelToolVariantId = null;
let wheelToolUnitPrice = 289;
let wheelToolCurrency = "CAD";

async function shopifyStorefrontRequest(query, variables = {}) {
  const response = await fetch(
    `https://${SHOPIFY_STORE_DOMAIN}/api/${SHOPIFY_API_VERSION}/graphql.json`,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Shopify-Storefront-Access-Token": SHOPIFY_STOREFRONT_TOKEN
      },
      body: JSON.stringify({ query, variables })
    }
  );

  const payload = await response.json();

  if (!response.ok || payload.errors) {
    throw new Error(
      payload.errors?.map(error => error.message).join("; ") ||
      `Shopify Storefront API returned ${response.status}`
    );
  }

  return payload.data;
}

function formatMoney(amount, currency) {
  const value = Number(amount);
  try {
    return new Intl.NumberFormat("en-CA", {
      style: "currency",
      currency,
      currencyDisplay: "code"
    }).format(value);
  } catch {
    return `${currency} $${value.toFixed(2)}`;
  }
}

function clampQuantity(value) {
  const parsed = Number.parseInt(value, 10);
  if (!Number.isFinite(parsed)) return 1;
  return Math.max(1, Math.min(10, parsed));
}

function updateWheelToolSubtotal() {
  const qtyInput = document.getElementById("wheeltool-qty");
  const qty = clampQuantity(qtyInput.value);
  qtyInput.value = qty;

  document.getElementById("wheeltool-subtotal").textContent =
    formatMoney(wheelToolUnitPrice * qty, wheelToolCurrency);
}

function showShopifyError(message) {
  const errorBox = document.getElementById("shopify-cart-error");
  errorBox.textContent = message;
  errorBox.style.display = "block";
}

function clearShopifyError() {
  const errorBox = document.getElementById("shopify-cart-error");
  errorBox.textContent = "";
  errorBox.style.display = "none";
}

async function loadWheelToolProduct() {
  const query = `
    query WheelToolProduct($handle: String!) {
      product(handle: $handle) {
        title
        featuredImage {
          url
          altText
        }
        variants(first: 10) {
          nodes {
            id
            title
            availableForSale
            price {
              amount
              currencyCode
            }
          }
        }
      }
    }
  `;

  const data = await shopifyStorefrontRequest(query, {
    handle: SHOPIFY_PRODUCT_HANDLE
  });

  if (!data.product) {
    throw new Error("WheelTool was not found in the Shopify storefront.");
  }

  const variant =
    data.product.variants.nodes.find(item => item.availableForSale) ||
    data.product.variants.nodes[0];

  if (!variant) {
    throw new Error("WheelTool has no purchasable Shopify variant.");
  }

  wheelToolVariantId = variant.id;
  wheelToolUnitPrice = Number(variant.price.amount);
  wheelToolCurrency = variant.price.currencyCode;

  const unitPriceText = `${formatMoney(wheelToolUnitPrice, wheelToolCurrency)} each`;
  document.getElementById("shopify-unit-price").textContent = unitPriceText;
  document.getElementById("open-wheeltool-cart").textContent =
    `BUY WHEELTOOL — ${formatMoney(wheelToolUnitPrice, wheelToolCurrency)}`;

  if (data.product.featuredImage?.url) {
    const modalImage = document.querySelector(".shopify-cart-product img");
    modalImage.src = data.product.featuredImage.url;
    modalImage.alt = data.product.featuredImage.altText || "WheelTool";
  }

  updateWheelToolSubtotal();
}

async function createWheelToolCartAndCheckout() {
  clearShopifyError();

  if (!wheelToolVariantId) {
    showShopifyError("Shopify product data is still loading. Please try again in a moment.");
    return;
  }

  const qty = clampQuantity(document.getElementById("wheeltool-qty").value);
  const checkoutButton = document.getElementById("shopify-checkout-button");
  const originalText = checkoutButton.textContent;

  checkoutButton.disabled = true;
  checkoutButton.textContent = "OPENING CHECKOUT...";

  try {
    const mutation = `
      mutation CreateWheelToolCart($input: CartInput!) {
        cartCreate(input: $input) {
          cart {
            id
            checkoutUrl
          }
          userErrors {
            field
            message
          }
        }
      }
    `;

    const data = await shopifyStorefrontRequest(mutation, {
      input: {
        lines: [
          {
            merchandiseId: wheelToolVariantId,
            quantity: qty
          }
        ]
      }
    });

    const result = data.cartCreate;

    if (result.userErrors?.length) {
      throw new Error(result.userErrors.map(error => error.message).join("; "));
    }

    if (!result.cart?.checkoutUrl) {
      throw new Error("Shopify did not return a checkout URL.");
    }

    window.location.href = result.cart.checkoutUrl;
  } catch (error) {
    console.error("Shopify checkout error:", error);
    showShopifyError(
      "Checkout could not be opened. Please try again or use Order / Support below."
    );
    checkoutButton.disabled = false;
    checkoutButton.textContent = originalText;
  }
}

const cartOverlay = document.getElementById("shopify-cart-overlay");
const openCartButton = document.getElementById("open-wheeltool-cart");
const closeCartButton = document.getElementById("close-wheeltool-cart");
const qtyInput = document.getElementById("wheeltool-qty");

function openWheelToolCart() {
  clearShopifyError();
  cartOverlay.classList.add("is-open");
  cartOverlay.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeWheelToolCart() {
  cartOverlay.classList.remove("is-open");
  cartOverlay.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

openCartButton.addEventListener("click", openWheelToolCart);
closeCartButton.addEventListener("click", closeWheelToolCart);

cartOverlay.addEventListener("click", (event) => {
  if (event.target === cartOverlay) closeWheelToolCart();
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && cartOverlay.classList.contains("is-open")) {
    closeWheelToolCart();
  }
});

document.getElementById("qty-minus").addEventListener("click", () => {
  qtyInput.value = clampQuantity(Number(qtyInput.value) - 1);
  updateWheelToolSubtotal();
});

document.getElementById("qty-plus").addEventListener("click", () => {
  qtyInput.value = clampQuantity(Number(qtyInput.value) + 1);
  updateWheelToolSubtotal();
});

qtyInput.addEventListener("input", updateWheelToolSubtotal);
qtyInput.addEventListener("change", updateWheelToolSubtotal);

document
  .getElementById("shopify-checkout-button")
  .addEventListener("click", createWheelToolCartAndCheckout);

loadWheelToolProduct().catch(error => {
  console.error("WheelTool product loading error:", error);
  // Keep the static CAD $289 display as a graceful fallback.
});
</script>

<script>
const GITHUB_OWNER = "romanolinikmail-droid";
const GITHUB_REPO = "yomanworks";

async function syncLatestWheelToolRelease() {
  const button = document.getElementById("apk-download");

  try {
    const response = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases?per_page=10`,
      {
        headers: { "Accept": "application/vnd.github+json" },
        cache: "no-store"
      }
    );

    if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);

    const releases = await response.json();
    const release = releases.find(r => !r.draft && !r.prerelease);

    if (!release) throw new Error("No published release found");

    const apk = (release.assets || []).find(asset =>
      asset.name.toLowerCase().endsWith(".apk")
    );

    if (!apk) throw new Error("Latest release has no APK asset");

    const releaseName = (release.name || release.tag_name || "").trim();

    button.textContent = `Download APK ${releaseName}`;
    button.href = apk.browser_download_url;
    button.style.display = "inline-block";
  } catch (error) {
    console.error("WheelTool release sync failed:", error);
    button.textContent = "Download APK";
    button.href = `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/releases`;
    button.style.display = "inline-block";
  }
}

syncLatestWheelToolRelease();
</script>

<script>
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
const lynx = document.getElementById("lynx");
let mouseX = 0, mouseY = 0, lynxX = 0, lynxY = 0, prevMouseX = 0, tilt = 0;

document.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  const deltaX = mouseX - prevMouseX;
  prevMouseX = mouseX;
  tilt += deltaX * 0.2;
  tilt *= 0.85;
  tilt = Math.max(-45, Math.min(45, tilt));
});

function animate() {
  lynxX += (mouseX - lynxX) * 0.1;
  lynxY += (mouseY - lynxY) * 0.1;
  tilt *= 0.9;
  if (Math.abs(tilt) < 0.05) tilt = 0;
  lynx.style.transform =
    `translate(${lynxX - -40}px, ${lynxY - -20}px) rotate(${tilt}deg)`;
  requestAnimationFrame(animate);
}
animate();
</script>
